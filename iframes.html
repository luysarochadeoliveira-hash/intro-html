<h1> O que é um Iframe?</h1>
<p> iframe significa,<strong> inline frame </strong> </p>
<p>Ele permite que você <em> incorpore </em> outra página/documento dentro da sua própria página htlm.</p>

<hr>
<h2>Criando um ifrma básico.</h2>
<iframe src="listas.html" frameborder="0"></iframe>

<hr>
